version: '3.8'

services:
  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: evolution-go
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Server
      - SERVER_PORT=8080
      - CLIENT_NAME=quark
      # Security
      - GLOBAL_API_KEY=${EVOLUTION_API_KEY:-quark_senha_secreta_123}
      # Database (PostgreSQL)
      - POSTGRES_AUTH_DB=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-quark123}@postgres:5432/${POSTGRES_DB:-evogo_auth}?sslmode=disable
      - POSTGRES_USERS_DB=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-quark123}@postgres:5432/evogo_users?sslmode=disable
      - DATABASE_SAVE_MESSAGES=false
      # Logging
      - WADEBUG=INFO
      - LOGTYPE=console
      # Webhook global (opcional - cada instância pode sobrescrever)
      - WEBHOOK_URL=${WEBHOOK_URL:-http://host.docker.internal:3001/webhook/evolution}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - evolution

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quark123}
      - POSTGRES_DB=${POSTGRES_DB:-evogo_auth}
    ports:
      - "5433:5432"
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - evolution
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  evolution:
    driver: bridge

volumes:
  evolution_db_data:
