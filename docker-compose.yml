version: '3.8'

services:
  # ─── WHATSAPP API (EVOLUTION) ───
  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: evolution-go
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - CLIENT_NAME=quark
      - GLOBAL_API_KEY=${EVOLUTION_API_KEY:-quark_senha_secreta_123}
      - POSTGRES_AUTH_DB=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-quark123}@postgres:5432/${POSTGRES_DB:-evogo_auth}?sslmode=disable
      - POSTGRES_USERS_DB=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-quark123}@postgres:5432/evogo_users?sslmode=disable
      - DATABASE_SAVE_MESSAGES=false
      - WADEBUG=INFO
      - LOGTYPE=console
      - WEBHOOK_URL=${WEBHOOK_URL:-http://host.docker.internal:3001/webhook/evolution}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quark_net

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-quark123}
      - POSTGRES_DB=${POSTGRES_DB:-evogo_auth}
    ports:
      - "5433:5432"
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - quark_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── N8N (AUTOMATIZAÇÕES) ───
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-quark
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - SUPABASE_URL=${SUPABASE_URL:-cole_sua_url_do_supabase_aqui}
      - SUPABASE_KEY=${SUPABASE_KEY:-cole_sua_anon_key_do_supabase_aqui}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - quark_net

networks:
  quark_net:
    driver: bridge

volumes:
  evolution_db_data:
  n8n_data:
